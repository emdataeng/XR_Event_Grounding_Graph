# Operator prompts for novice-support test cases.
#
# Cases are grouped by scenario from
# experiments/docs_experiments/battery_of_questions_v1.md.
# The `question` field is sent to the LLM. The group key, `scenario`,
# `status`, `expected_answer_elements`, `what_to_query`, and scenario query
# deltas are evaluation/design metadata and must not be sent to the LLM.

question_set_id: novice_questions
question_set_version: v4

what_to_query:
  narrative:
    - "Each question belongs to a scenario."
    - "The scenario describes what kind of operator problem we are testing."
    - "For each question, the baseline chooses one fixed retrieval template."
    - "That template runs a predefined Cypher pattern around the current step."
  reusable_retrieval_evidence_contract:
    step_identity:
      - "current step fields: step_id, index, action_description, action_name, object_ids, object_labels, status, confidence"
    current_object_or_component:
      - "current step -> HAS_PREDICATE -> usesObject(args)"
      - "current step -> HAS_ENTITY -> Entity(entity_id, labels)"
      - "current step -> HAS_PREDICATE -> hasParentComponent(args)"
      - "current step -> HAS_PREDICATE -> isA(args)"
    current_action:
      - "current step -> HAS_PREDICATE -> hasAction(args)"
      - "current step fields: action_event_type, action_name"
    installation_target:
      - "current step -> HAS_PREDICATE -> installationTarget(args)"
      - "current step -> HAS_PREDICATE -> hasInstallTarget(args)"
    requirements_and_preconditions:
      - "current step -> HAS_PREDICATE -> requiresInstalledBefore(args)"
      - "current step -> HAS_CONSTRAINT -> requires(args)"
      - "current step -> REQUIRES -> Constraint(name, kind, args, status, support_status)"
    produced_effects:
      - "current step -> PRODUCES -> Constraint(name, kind, args, status)"
      - "current step -> HAS_CONSTRAINT -> produces(args)"
    support_and_provenance:
      - "Constraint -> SUPPORTED_BY -> Predicate or Constraint evidence"
      - "Constraint -> DERIVED_FROM -> source predicate, source rule, or configured domain knowledge"
    safety_conditions:
      - "current step -> HAS_CONSTRAINT -> requiresSafety(args)"
      - "current step -> REQUIRES -> requiresSafety(args)"
    tool_requirements_and_observations:
      - "current step -> HAS_CONSTRAINT -> requiresTool/requiresTools(args)"
      - "current step -> REQUIRES -> requiresTool/requiresTools(args)"
      - "current step -> HAS_PREDICATE -> usesTool(args), when observed"
    dependencies_and_sequence:
      - "current step -> DEPENDS_ON -> prerequisite step"
      - "dependent step -> DEPENDS_ON -> current step"
      - "previous step -> NEXT -> current step -> NEXT -> next step"
    lifecycle_and_invalidation:
      - "earlier step -> PRODUCES -> produced effect"
      - "produced effect -> INVALIDATED_BY -> invalidating effect"
      - "current removal/rework step -> PRODUCES -> invalidating effect"
    missing_evidence_controls:
      - "current_step_found flag for unknown step ids"
      - "empty or missing SUPPORT/DERIVED_FROM evidence should remain visible"
      - "absence of graph evidence should be treated as unknown, not as permission to infer"

scenario_query_deltas:
  scenario_a_dependency_and_prerequisite_checks:
    focus:
      - "current object, current action, installation target, prerequisites, produced effects, supports, dependencies, and sequence neighbors"
    gaps_to_cover:
      - "include HAS_PREDICATE and HAS_ENTITY when using installation-style retrieval templates"
      - "include SUPPORTED_BY so required vs satisfied conditions can be separated"
  scenario_b_troubleshooting_implicit_conditions:
    focus:
      - "implicit assembly requirements such as alignment, their support status, and exception/override evidence"
    gaps_to_cover:
      - "retrieve DERIVED_FROM or rule provenance when a general condition is overridden, such as base alignment"
      - "do not treat a requirement as observed evidence unless SUPPORTED_BY evidence exists"
  scenario_c_safety_and_tool_constraints:
    focus:
      - "safety constraints, tool requirements, observed tool use, and missing support evidence"
    gaps_to_cover:
      - "tool retrieval must include REQUIRES, HAS_CONSTRAINT, HAS_PREDICATE, HAS_ENTITY, PRODUCES, and SUPPORTED_BY"
      - "keep required-tool facts separate from observed usesTool evidence"
  scenario_d_state_lifecycle_and_error_recovery:
    focus:
      - "removal preconditions, produced removal effects, invalidated prior effects, and earlier producing steps"
    gaps_to_cover:
      - "retrieve INVALIDATED_BY plus the earlier step that produced the invalidated installed state"
      - "do not reuse invalidated historical effects as future support"
  scenario_e_validation_status_provenance_and_relation_precision:
    focus:
      - "validation status, confidence, warnings, provenance, support status, and precise relation labels"
    gaps_to_cover:
      - "include REQUIRES, PRODUCES, SUPPORTED_BY, DERIVED_FROM, HAS_PREDICATE, and HAS_CONSTRAINT"
      - "preserve relation labels so target, support, parent, and tool are not conflated"
  scenario_f_missing_evidence_controls:
    focus:
      - "unknown steps, ambiguous questions, unmodeled values, and requests for visual evidence not present in graph rows"
    gaps_to_cover:
      - "return current_step_found=false for absent step ids"
      - "state when torque, direct video confirmation, or other requested facts are not represented"

scenario_groups:
  scenario_a_dependency_and_prerequisite_checks:
    - case_id: "q01_sequence_control_current_and_next_action"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_1"
      status: "Runnable now"
      question: "I have reached this step. What component should I work on now, and what action should I take?"      
      expected_answer_elements:
        - "identify the rear chassis as the current object"
        - "identify installation as the current action"
        - "identify the action on the object without inventing skipped work"

    - case_id: "q02_sequence_control_named_part_mismatch"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_2"
      status: "Runnable now"
      question: "I picked up the front chassis. Does that match the current step?"
      expected_answer_elements:
        - "state that the current object is the front rear chassis pin"
        - "identify the named part as a mismatch"
        - "advise against continuing with the wrong component"

    - case_id: "q03_direct_installation_target"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_6"
      status: "Runnable now"
      question: "Which component is the front bracket supposed to be installed onto?"
      expected_answer_elements:
        - "answer front_chassis"
        - "distinguish the installation target from the base or rear chassis"
        - "avoid inventing a physical mounting location not represented in the model"

    - case_id: "q04_wrong_part_target_check"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_5"
      status: "Runnable now as target lookup"
      question: "Can I use the rear chassis pin for the front bracket?"
      expected_answer_elements:
        - "answer no"
        - "identify rear_chassis as the rear chassis pin's modeled installation target"
        - "explain that the front bracket is not the modeled target for that pin"
        - "avoid claiming a hard graph rejection unless the proposed wrong target is explicitly represented"

    - case_id: "q05_nested_prerequisite"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_7"
      status: "Runnable now"
      question: "Before installing this screw, which component must already be installed, and what supports that component?"
      expected_answer_elements:
        - "identify front_bracket as the screw's installation target"
        - "identify front_chassis as the bracket's support"
        - "explain that the bracket must already be installed on the front chassis"

    - case_id: "q06_front_rear_chassis_pin_readiness"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_2"
      status: "Runnable now"
      question: "I have the front rear chassis pin ready. Can I install it now, or is anything still missing?"
      expected_answer_elements:
        - "verify that rear_chassis is installed on base"
        - "require alignment between the pin and rear chassis"
        - "check secured(base, workspace)"
        - "check secured(rear_chassis, base)"
        - "recommend continuing only if every requirement is supported"

  scenario_b_troubleshooting_implicit_conditions:
    - case_id: "q07_component_alignment"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_8"
      status: "Runnable now"
      question: "What must be aligned before I install the front wheel assembly, and what should it be aligned with?"
      expected_answer_elements:
        - "identify front_wheel_assy"
        - "identify front_chassis as its target"
        - "state that the wheel assembly must be aligned with the front chassis"
        - "avoid claiming that alignment has been observed unless support exists"

    - case_id: "q08_front_bracket_screw_troubleshooting"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_7"
      status: "Runnable now"
      question: "The front bracket screw is not going into the bracket correctly. What should I check or verify before using more force?"
      expected_answer_elements:
        - "check aligned(front_bracket_screw, front_bracket)"
        - "verify that the front bracket is already installed on the front chassis"
        - "avoid inventing torque, hole geometry, or physical damage evidence"

    - case_id: "q09_root_component_alignment_exception"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_0"
      status: "Runnable now"
      question: "Do I need to align the base with the workspace before installing it, or can I just place it down?"
      expected_answer_elements:
        - "answer no"
        - "explain that the base explicitly overrides inherited required conditions"
        - "avoid applying the general component alignment requirement to the base"

    - case_id: "q10_alignment_requirement_versus_satisfaction"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_4"
      status: "Runnable now"
      question: "I know the pin needs to be aligned with the front chassis. Has that already been confirmed, or is it still something I need to check?"
      expected_answer_elements:
        - "distinguish alignment is required from alignment is supported"
        - "report the requirement as missing when no supporting alignment evidence is present"
        - "advise against treating a configured requirement as proof of satisfaction"

  scenario_c_safety_and_tool_constraints:
    - case_id: "q11_front_chassis_pin_safety_prerequisites"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_2"
      status: "Runnable now"
      question: "Before I install this pin, which assemblies need to already be secured, and how do I know if they actually are?"
      expected_answer_elements:
        - "identify secured(base, workspace)"
        - "identify secured(rear_chassis, base)"
        - "distinguish supported from missing safety requirements"
        - "avoid recommending continuation while a required safety condition is missing"

    - case_id: "q12_rear_chassis_pin_safety_prerequisites"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_5"
      status: "Runnable now"
      question: "I am about to install the rear rear chassis pin. Which safety checks must I verify first, and are those checks already confirmed or do I still need to do them?"
      expected_answer_elements:
        - "identify secured(base, workspace)"
        - "identify secured(rear_chassis, base)"
        - "distinguish supported from missing safety requirements"
        - "avoid recommending continuation while a required safety condition is missing"

    - case_id: "q13_securing_is_not_installation"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_2"
      status: "Runnable now"
      question: "The rear chassis was installed earlier. Does that mean it was properly secured to the base, or are those two different things?"
      expected_answer_elements:
        - "answer no"
        - "explain that installation and securing are distinct facts"
        - "require explicit securing evidence"

    - case_id: "q14_required_tool_versus_observed_tool_use"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_7"
      status: "Runnable now"
      question: "Which tool do I need for this step, and is there any confirmation it was actually used, or just that it's supposed to be used?"
      expected_answer_elements:
        - "identify screwdriver as the required tool"
        - "distinguish the configured tool requirement from observed tool use"
        - "report missing support if no usesTool evidence is present"

    - case_id: "q15_unsupported_tool_proposal"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_4"
      status: "Runnable now"
      question: "Should I use the screwdriver for this pin because it was required for the screw step?"
      expected_answer_elements:
        - "do not transfer the screw's tool requirement to the pin"
        - "state that no screwdriver requirement is modeled for the pin"
        - "advise against using a tool without step-specific evidence"

    - case_id: "q16_combined_requirements"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_2"
      status: "Runnable now for chassis pins"
      question: "For the current step, what tool do I need, what assembly conditions must be in place, and what safety checks are required? Which of these are already confirmed and which do I still need to verify?"
      expected_answer_elements:
        - "enumerate every modeled requirement visible for the step"
        - "separate tools, assembly prerequisites, alignment, and safety checks"
        - "distinguish supported requirements from missing requirements"

  scenario_d_state_lifecycle_and_error_recovery:
    - case_id: "q17_removal_precondition"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_9"
      status: "Runnable now"
      question: "What needs to already be done before I can remove the front wheel assembly, and did I already do it at an earlier step?"
      expected_answer_elements:
        - "require installed(front_wheel_assy, front_chassis)"
        - "identify the earlier wheel-installation step as support"
        - "explain the dependency rather than merely repeating remove wheel"

    - case_id: "q18_removal_invalidates_installed_state"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_9"
      status: "Runnable now"
      question: "After this removal, should the front wheel assembly still count as installed on the front chassis?"
      expected_answer_elements:
        - "answer no"
        - "identify the removal effect"
        - "explain that the earlier installed effect remains historical but is invalidated for future support"

    - case_id: "q19_reinstallation_guidance_after_removal"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_9"
      status: "Runnable now"
      question: "After removing the front wheel assembly, if I need to use it again later, what would need to happen first before I can do that?"
      expected_answer_elements:
        - "require a new installation on the front chassis after the removal"
        - "require any applicable alignment condition"
        - "do not reuse the invalidated earlier effect"

  scenario_e_validation_status_provenance_and_relation_precision:
    - case_id: "q20_high_confidence_but_uncertain_validation"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_2"
      status: "Runnable now with selection"
      question: "The detection confidence is high, so why is this step still uncertain?"
      expected_answer_elements:
        - "distinguish observation confidence from validation status"
        - "identify missing alignment and/or safety requirements"
        - "explain that confidence alone does not satisfy requirements"

    - case_id: "q21_why_accepted"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_1"
      status: "Runnable now with selection"
      question: "Why is it okay to proceed with this step? What earlier completed action makes it possible to do this now?"
      expected_answer_elements:
        - "identify the requirement"
        - "identify its supporting produced effect"
        - "identify the earlier producing step"
        - "avoid explaining acceptance from confidence alone"

    - case_id: "q22_provenance_of_an_inferred_requirement"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_6"
      status: "Runnable now"
      question: "Where did this requirement come from: the source event, the domain model, or an inference rule?"
      expected_answer_elements:
        - "identify the relevant predicates"
        - "identify the rule that produced the constraint"
        - "distinguish manually configured domain knowledge from observed event evidence"
        - "avoid presenting inferred knowledge as direct visual observation"

    - case_id: "q23_relation_label_precision"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_7"
      status: "Runnable now"
      question: "What is the screw installed onto? What tool does the screw require? What component supports the bracket?"
      expected_answer_elements:
        - "installation target: front_bracket"
        - "required tool: screwdriver"
        - "bracket support: front_chassis"
        - "do not conflate target, support, parent, and tool"

    - case_id: "q24_multiple_missing_requirements"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_2"
      status: "Runnable now"
      question: "I want to move on to the next step. What do I still need to confirm or complete before I can safely do that?"
      expected_answer_elements:
        - "identify missing alignment if unsupported"
        - "identify secured(base, workspace) if unsupported"
        - "identify the relevant target-securing requirement, such as secured(rear_chassis, base), if unsupported"
        - "avoid collapsing specific missing requirements into a vague warning"

  scenario_f_missing_evidence_controls:
    - case_id: "q25_video_confirmation"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_4"
      status: "Runnable now"
      question: "Can you confirm from the video that the pin is physically aligned?"
      expected_answer_elements:
        - "state that no direct video evidence is in the prompt"
        - "avoid claiming physical alignment"
        - "distinguish modeled requirements from observed visual state"

    - case_id: "q26_unmodeled_torque"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_7"
      status: "Runnable now"
      question: "What torque should I use for the front bracket screw?"
      expected_answer_elements:
        - "state that no torque value is represented"
        - "avoid inventing a value"
        - "refer the operator to authoritative instructions or a supervisor"

    - case_id: "q27_unknown_step"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_999"
      status: "Runnable now"
      question: "I cannot find this step. What should I do next?"
      expected_answer_elements:
        - "state that the step is absent"
        - "request the correct step or procedure context"
        - "avoid fabricating a sequence"

    - case_id: "q28_ambiguous_okay_question"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_1"
      status: "Runnable now"
      question: "Is this okay?"
      expected_answer_elements:
        - "ask for the current step, component, and concern"
        - "avoid inventing missing context"
        - "provide only safe, evidence-grounded guidance"

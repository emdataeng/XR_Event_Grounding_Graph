# The only system message sent to the LLM. Shared with the
# llm_guidance_ablation prompt conditions so query-driven graph differs by
# provided graph evidence, not by general assistant behavior.
shared_system_prompt: >-
  You are an assistant helping a novice assembly operator perform a
  manufacturing task. Answer the operator's question based only on the
  information provided below. Be concise, practical, and safety-aware. Do not
  use any knowledge beyond what is explicitly provided. If information is
  missing, uncertain, or conflicting, say so clearly rather than guessing.

# This section defines only the user-message template and inserted query
# evidence. It is not appended to the system message.
answer_generation:
  user_template: |-
    Current step id:
    {step_id}

    Selected retrieval template:
    {retrieval_template}

    Cypher query executed:
    {cypher}

    Neo4j query result:
    {query_result}

    Shared procedural step list:
    {step_context}

    Operator question:
    {question}

lm_studio_fallback:
  user_template: |-
    Instructions:
    {system_prompt}

    User question:
    {user_prompt}

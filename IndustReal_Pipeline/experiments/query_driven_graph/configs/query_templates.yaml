# risk_type is evaluation metadata. Query intent is retrieval behavior.
# This mapping keeps the evaluation taxonomy separate from the Cypher template names.

default_intent: current_step_context

intent_by_case_id:
  q01_sequence_control_current_and_next_action: sequence_context
  q02_sequence_control_named_part_mismatch: component_check
  q03_direct_installation_target: installation_check
  q04_wrong_part_target_check: installation_check
  q05_nested_prerequisite: installation_check
  q06_front_rear_chassis_pin_readiness: installation_check
  q07_component_alignment: installation_check
  q08_front_bracket_screw_troubleshooting: installation_check
  q09_root_component_alignment_exception: installation_check
  q10_alignment_requirement_versus_satisfaction: evidence_confidence
  q11_front_chassis_pin_safety_prerequisites: installation_check
  q12_rear_chassis_pin_safety_prerequisites: installation_check
  q13_securing_is_not_installation: installation_check
  q14_required_tool_versus_observed_tool_use: tool_context
  q15_unsupported_tool_proposal: tool_context
  q16_combined_requirements: installation_check
  q17_removal_precondition: removal_or_rework_check
  q18_removal_invalidates_installed_state: removal_or_rework_check
  q19_reinstallation_guidance_after_removal: removal_or_rework_check
  q20_high_confidence_but_uncertain_validation: evidence_confidence
  q21_why_accepted: evidence_confidence
  q22_provenance_of_an_inferred_requirement: evidence_confidence
  q23_relation_label_precision: current_step_context
  q24_multiple_missing_requirements: installation_check
  q25_video_confirmation: evidence_confidence
  q26_unmodeled_torque: current_step_context
  q27_unknown_step: current_step_context
  q28_ambiguous_okay_question: current_step_context

intent_by_risk_type:
  sequence_error: sequence_context
  component_confusion: component_check
  incorrect_installation: installation_check
  tool_usage_error: tool_context
  missing_context: current_step_context
  removal_or_rework_error: removal_or_rework_check
  confidence_or_evidence_issue: evidence_confidence

templates:
  current_step_context:
    description: "Retrieve the current step and direct graph evidence."
    cypher: |-
      OPTIONAL MATCH (s:Step {graph_name: $graph_name})
      WHERE s.step_id = $step_id
      OPTIONAL MATCH path = (s)-[*0..{evidence_hops}]-(n)
      WHERE length(path) > 0
        AND all(intermediate IN nodes(path)[1..-1]
                WHERE intermediate:Predicate OR intermediate:Constraint)
      WITH s, n, path, last(relationships(path)) AS r
      RETURN
        $step_id AS requested_step_id,
        s IS NOT NULL AS current_step_found,
        s.step_id AS step_id,
        s.index AS step_index,
        s.action_description AS action_description,
        s.action_name AS action_name,
        s.object_labels AS object_labels,
        s.status AS status,
        s.confidence AS confidence,
        type(r) AS relation,
        labels(n) AS neighbor_labels,
        n.display_label AS neighbor_label,
        n.name AS neighbor_name,
        n.args AS neighbor_args,
        length(path) AS evidence_distance
      ORDER BY evidence_distance, relation, neighbor_label
      LIMIT $limit

  sequence_context:
    description: "Retrieve previous, current, and next procedural steps."
    cypher: |-
      MATCH (s:Step {graph_name: $graph_name})
      WHERE s.step_id = $step_id
      MATCH path = (s)-[:NEXT*0..{step_hops}]-(context:Step {graph_name: $graph_name})
      RETURN
        s.step_id AS current_step_id,
        s.index AS current_index,
        s.action_description AS current_action,
        s.object_labels AS current_objects,
        s.status AS current_status,
        context.step_id AS context_step_id,
        context.index AS context_index,
        context.action_description AS context_action,
        context.object_labels AS context_objects,
        context.status AS context_status,
        length(path) AS sequence_distance,
        CASE
          WHEN context.index < s.index THEN 'previous'
          WHEN context.index > s.index THEN 'next'
          ELSE 'current'
        END AS sequence_position
      ORDER BY sequence_distance, context_index
      LIMIT $limit

  component_check:
    description: "Retrieve component/object evidence attached to the current step."
    cypher: |-
      MATCH (s:Step {graph_name: $graph_name})
      WHERE s.step_id = $step_id
      OPTIONAL MATCH path = (s)-[:HAS_ENTITY|HAS_PREDICATE|HAS_CONSTRAINT*0..{evidence_hops}]-(n)
      WHERE length(path) > 0
        AND all(intermediate IN nodes(path)[1..-1]
                WHERE intermediate:Predicate OR intermediate:Constraint)
      WITH s, n, path, last(relationships(path)) AS r
      RETURN
        s.step_id AS step_id,
        s.action_description AS action_description,
        s.object_ids AS object_ids,
        s.object_labels AS object_labels,
        type(r) AS relation,
        labels(n) AS evidence_labels,
        n.display_label AS evidence_label,
        n.name AS evidence_name,
        n.args AS evidence_args,
        n.kind AS evidence_kind,
        n.confidence AS evidence_confidence,
        length(path) AS evidence_distance
      ORDER BY evidence_distance, relation, evidence_label
      LIMIT $limit

  installation_check:
    description: "Retrieve requirements, produced effects, and support around the current step."
    cypher: |-
      MATCH (s:Step {graph_name: $graph_name})
      WHERE s.step_id = $step_id
      OPTIONAL MATCH path = (s)-[:HAS_CONSTRAINT|REQUIRES|PRODUCES|DEPENDS_ON|SUPPORTED_BY*0..{evidence_hops}]-(n)
      WHERE length(path) > 0
        AND all(intermediate IN nodes(path)[1..-1]
                WHERE intermediate:Predicate OR intermediate:Constraint)
      WITH s, n, path, last(relationships(path)) AS rel
      RETURN
        s.step_id AS step_id,
        s.action_description AS action_description,
        s.object_labels AS object_labels,
        s.status AS status,
        type(rel) AS relation,
        rel.required_condition AS required_condition,
        rel.supporting_effect AS supporting_effect,
        labels(n) AS evidence_labels,
        n.display_label AS evidence_label,
        n.name AS evidence_name,
        n.args AS evidence_args,
        n.kind AS evidence_kind,
        n.status AS evidence_status,
        n.support_status AS support_status,
        length(path) AS evidence_distance
      ORDER BY evidence_distance, relation, evidence_label
      LIMIT $limit

  tool_context:
    description: "Retrieve current step evidence likely to mention tools or missing tool evidence."
    cypher: |-
      MATCH (s:Step {graph_name: $graph_name})
      WHERE s.step_id = $step_id
      OPTIONAL MATCH path = (s)-[:HAS_PREDICATE|HAS_CONSTRAINT|HAS_ENTITY*0..{evidence_hops}]-(n)
      WHERE length(path) > 0
        AND all(intermediate IN nodes(path)[1..-1]
                WHERE intermediate:Predicate OR intermediate:Constraint)
        AND (
          toLower(coalesce(n.display_label, '') + ' ' + coalesce(n.name, '') + ' ' + coalesce(n.kind, '')) CONTAINS 'tool'
          OR toLower(coalesce(s.action_description, '')) CONTAINS 'tool'
        )
      WITH s, n, path, last(relationships(path)) AS r
      RETURN
        s.step_id AS step_id,
        s.action_description AS action_description,
        s.object_labels AS object_labels,
        type(r) AS relation,
        labels(n) AS evidence_labels,
        n.display_label AS evidence_label,
        n.name AS evidence_name,
        n.args AS evidence_args,
        n.kind AS evidence_kind,
        length(path) AS evidence_distance
      ORDER BY evidence_distance, relation, evidence_label
      LIMIT $limit

  removal_or_rework_check:
    description: "Retrieve removal/rework evidence, invalidations, and dependencies."
    cypher: |-
      MATCH (s:Step {graph_name: $graph_name})
      WHERE s.step_id = $step_id
      OPTIONAL MATCH path = (s)-[:HAS_CONSTRAINT|REQUIRES|PRODUCES|DEPENDS_ON|INVALIDATED_BY*0..{evidence_hops}]-(n)
      WHERE length(path) > 0
        AND all(intermediate IN nodes(path)[1..-1]
                WHERE intermediate:Predicate OR intermediate:Constraint)
      WITH s, n, path, last(relationships(path)) AS rel
      RETURN
        s.step_id AS step_id,
        s.action_description AS action_description,
        s.action_name AS action_name,
        s.object_labels AS object_labels,
        s.invalidates_effect_count AS invalidates_effect_count,
        s.invalidated_effects AS invalidated_effects,
        type(rel) AS relation,
        rel.required_condition AS required_condition,
        rel.supporting_effect AS supporting_effect,
        labels(n) AS evidence_labels,
        n.display_label AS evidence_label,
        n.name AS evidence_name,
        n.args AS evidence_args,
        n.status AS evidence_status,
        length(path) AS evidence_distance
      ORDER BY evidence_distance, relation, evidence_label
      LIMIT $limit

  evidence_confidence:
    description: "Retrieve confidence, status, warnings, and source/provenance evidence."
    cypher: |-
      MATCH (s:Step {graph_name: $graph_name})
      WHERE s.step_id = $step_id
      OPTIONAL MATCH path = (s)-[:HAS_PREDICATE|HAS_CONSTRAINT|DERIVED_FROM|SUPPORTED_BY*0..{evidence_hops}]-(n)
      WHERE length(path) > 0
        AND all(intermediate IN nodes(path)[1..-1]
                WHERE intermediate:Predicate OR intermediate:Constraint)
      WITH s, n, path, last(relationships(path)) AS r
      RETURN
        s.step_id AS step_id,
        s.action_description AS action_description,
        s.status AS status,
        s.confidence AS confidence,
        s.warning_count AS warning_count,
        s.has_rule_coverage AS has_rule_coverage,
        s.has_expected_effect AS has_expected_effect,
        type(r) AS relation,
        labels(n) AS evidence_labels,
        n.display_label AS evidence_label,
        n.name AS evidence_name,
        n.args AS evidence_args,
        n.confidence AS evidence_confidence,
        n.status AS evidence_status,
        n.support_status AS support_status,
        length(path) AS evidence_distance
      ORDER BY evidence_distance, relation, evidence_label
      LIMIT $limit

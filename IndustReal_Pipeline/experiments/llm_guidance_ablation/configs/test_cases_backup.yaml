# Backup bank of novice-support test cases.
#
# Cases are grouped by risk_type so a smaller evaluation set can be assembled
# later by copying selected cases into novice_questions.yaml.
# Evaluation-only fields must not be sent to the LLM.

risk_groups:
  sequence_error:
    - case_id: "sequence_001_next_step_uncertainty"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_001"
      question: "I am not sure which part should be installed next. What should I do before continuing?"
      expected_answer_elements:
        - "identify the current step"
        - "use the ordered step list"
        - "avoid skipping ahead"

    - case_id: "sequence_002_named_part_timing"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_002"
      question: "Am I supposed to install the front chassis now?"
      expected_answer_elements:
        - "compare the named part against the current step"
        - "state whether it matches the current step"
        - "refer to previous or next step when useful"

    - case_id: "sequence_003_after_previous_action"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_004"
      question: "I finished the previous part and want to move on. Which step should I check before continuing?"
      expected_answer_elements:
        - "use current step id"
        - "mention previous and next step relationship"
        - "recommend confirming the current step before proceeding"

  component_confusion:
    - case_id: "component_001_similar_part"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_002"
      question: "This part looks similar to another one. How can I check whether it is the correct component?"
      expected_answer_elements:
        - "compare the component with the acted-on object"
        - "use the current step action description"
        - "avoid installing an uncertain component"

    - case_id: "component_002_named_part_check"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_006"
      question: "Am I supposed to install the rear wheel assembly now?"
      expected_answer_elements:
        - "compare the named component to the current step"
        - "state if the part belongs to another step"
        - "recommend following the ordered step list"

    - case_id: "component_003_part_label_uncertainty"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_007"
      question: "The label on the part is hard to read. What should I compare it against before installing it?"
      expected_answer_elements:
        - "identify the acted-on object for the current step"
        - "compare label or visible features"
        - "do not proceed if the component identity is uncertain"

  incorrect_installation:
    - case_id: "installation_001_target_check"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_003"
      question: "I'm about to install the part that corresponds to this step. What should I verify first regarding its installation target?"
      expected_answer_elements:
        - "identify the current part or component"
        - "verify the target location before installation"
        - "recommend checking fit or alignment"

    - case_id: "installation_002_seating_uncertainty"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_003"
      question: "I think I installed the part, but I am not sure it is seated correctly. What should I verify?"
      expected_answer_elements:
        - "check placement or seating"
        - "confirm the target location"
        - "resolve uncertainty before continuing"

    - case_id: "installation_003_orientation_check"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_004"
      question: "Before I press this piece into place, how should I check whether it is oriented correctly?"
      expected_answer_elements:
        - "use the current step component"
        - "verify orientation or alignment"
        - "avoid forcing the part"

  tool_usage_error:
    - case_id: "tool_001_which_tool"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_007"
      question: "Which tool should I use now?"
      expected_answer_elements:
        - "state whether tool information is available in the provided context"
        - "avoid inventing a tool if the step context does not specify one"
        - "ask for tool instructions or source documentation if missing"

    - case_id: "tool_002_screwdriver_used"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_007"
      question: "I just used a screwdriver, is that ok?"
      expected_answer_elements:
        - "check whether the provided context mentions a tool"
        - "avoid approving tool use without evidence"
        - "recommend verifying the procedure or supervisor guidance"

    - case_id: "tool_003_force_or_tool"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_004"
      question: "This part is not going in easily. Should I use a tool or apply more force?"
      expected_answer_elements:
        - "avoid recommending force without support"
        - "check alignment or component identity first"
        - "request tool-specific guidance if not present"

  missing_context:
    - case_id: "context_001_no_visible_step"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_999"
      question: "I cannot find this step in the instructions. What should I do?"
      expected_answer_elements:
        - "state that the step id is not found"
        - "ask for the correct step or instruction list"
        - "avoid giving procedural advice without context"

    - case_id: "context_002_ambiguous_question"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_001"
      question: "Is this okay?"
      expected_answer_elements:
        - "state that the question is underspecified"
        - "ask what component or action is being checked"
        - "refer to the current step context"

    - case_id: "context_003_need_current_state"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_005"
      question: "I lost track of where I am in the assembly. How should I recover?"
      expected_answer_elements:
        - "use current step and nearby sequence context"
        - "recommend checking completed previous steps"
        - "avoid guessing the operator's actual physical state"

  removal_or_rework_error:
    - case_id: "rework_001_remove_step_confusion"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_009"
      question: "This step says remove the front wheel assembly. Should I really take it off now?"
      expected_answer_elements:
        - "identify that the current action is remove"
        - "confirm the acted-on object"
        - "recommend following the current step if it matches the instructions"

    - case_id: "rework_002_removed_wrong_part"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_009"
      question: "I may have removed the wrong part. What should I check before continuing?"
      expected_answer_elements:
        - "identify the intended acted-on object"
        - "compare the removed part with the current step"
        - "recommend resolving the mismatch before proceeding"

  confidence_or_evidence_issue:
    - case_id: "confidence_001_low_confidence"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_001"
      question: "How certain is the system about this step?"
      expected_answer_elements:
        - "report the available confidence value"
        - "explain that confidence comes from the provided step context"
        - "avoid overstating certainty"

    - case_id: "confidence_002_missing_visual_evidence"
      step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_002"
      question: "Can you confirm from the video that I picked the right part?"
      expected_answer_elements:
        - "state whether visual evidence is present in the prompt context"
        - "avoid claiming direct video confirmation if unavailable"
        - "suggest checking the part against the step context"

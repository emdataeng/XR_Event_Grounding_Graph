test_cases:
  - case_id: "case_001_missing_context"
    step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_001"
    question: "I am not sure which part should be installed next. What should I do before continuing?"
    risk_type: "sequence_error"
    expected_answer_elements:
      - "identify the current procedural step"
      - "state the next required action"
      - "warn against skipping prerequisite steps"

  - case_id: "case_002_possible_wrong_part"
    step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_002"
    question: "This part looks similar to another one. How can I check whether it is the correct component?"
    risk_type: "component_confusion"
    expected_answer_elements:
      - "compare the component against the step requirement"
      - "use available identifiers or visual features"
      - "avoid installing an uncertain component"

  - case_id: "case_003_installation_validation"
    step_id: "raw_cad_dataset__all_test_clips::od_only::test_p1::03_assy_0_1::event_003"
    question: "I think I installed the part, but I am not sure it is seated correctly. What should I verify?"
    risk_type: "incorrect_installation"
    expected_answer_elements:
      - "check placement or attachment state"
      - "confirm the target location"
      - "recommend resolving uncertainty before moving on"
